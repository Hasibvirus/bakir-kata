<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>বাকির খাতা</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;800&display=swap">
<style>
/* Layout: a shopkeeper's ledger on a phone. A red cloth-bound cover card carries the running total (with a stitched edge);
   customers are ruled rows below it. Red ink means money owed, green means money received. */
:root {
  --bg: #F4F2F2;
  --surface: #FFFFFF;
  --ink: #231B1C;
  --muted: #6B5F61;
  --line: #E4DCDD;
  --khero: #9A1B26;
  --on-khero: #FFF7F7;
  --owe: #B3261E;
  --owe-bg: #FBE6E4;
  --ok: #17784F;
  --on-ok: #FFFFFF;
  --ok-bg: #E3F4EB;
  --focus: #1D5FA8;
  --font-display: 'Anek Bangla', 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  --font-head: 'Noto Serif Bengali', 'Anek Bangla', 'Hind Siliguri', serif;
  --font-body: 'Hind Siliguri', 'Noto Sans Bengali', 'Kalpurush', system-ui, sans-serif;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-base: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.75rem;
  --fs-2xl: 2.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131011;
    --surface: #1D1718;
    --ink: #F2EAEB;
    --muted: #AC9EA0;
    --line: #352B2C;
    --khero: #7E1721;
    --on-khero: #FFF3F3;
    --owe: #FF8A82;
    --owe-bg: #3A1C1B;
    --ok: #58D39B;
    --on-ok: #06241A;
    --ok-bg: #16322A;
    --focus: #7DB6F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131011;
  --surface: #1D1718;
  --ink: #F2EAEB;
  --muted: #AC9EA0;
  --line: #352B2C;
  --khero: #7E1721;
  --on-khero: #FFF3F3;
  --owe: #FF8A82;
  --owe-bg: #3A1C1B;
  --ok: #58D39B;
  --on-ok: #06241A;
  --ok-bg: #16322A;
  --focus: #7DB6F0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: 1.6;
  padding-block: 16px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
h2 { font-family: var(--font-head); font-size: var(--fs-lg); font-weight: 800; line-height: 1.3; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: var(--fs-base); font-weight: 700; }
.note { font-size: var(--fs-sm); color: var(--muted); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button { font-family: inherit; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }

/* cover */
.band {
  position: relative; background: var(--khero); color: var(--on-khero);
  border-radius: 14px; padding: 16px 16px 26px; display: grid; gap: 2px;
}
.band::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 9px;
  border-bottom: 2px dashed rgba(255, 255, 255, 0.4);
}
.band-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; }
.eyebrow { font-size: var(--fs-sm); letter-spacing: 0.04em; opacity: 0.85; }
.shop { font-family: var(--font-head); font-size: var(--fs-lg); font-weight: 800; overflow-wrap: anywhere; }
.band .lbl { font-size: var(--fs-sm); opacity: 0.85; margin-top: 8px; }
.band .total { font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.band .meta { font-size: var(--fs-sm); opacity: 0.9; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.14); color: var(--on-khero);
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn svg, .back svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--on-khero); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; padding: 8px 8px 8px 0; min-height: 44px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat .l { font-size: var(--fs-xs); color: var(--muted); }
.stat .v { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 800; overflow-wrap: anywhere; }
.stat .s { font-size: var(--fs-xs); color: var(--muted); }
.owe { color: var(--owe); }
.ok { color: var(--ok); }

.field { min-width: 0; display: grid; gap: 4px; }
.field label { font-size: var(--fs-sm); color: var(--muted); }
.field input, .field textarea {
  width: 100%; min-width: 0; padding: 0 12px; height: 48px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.125rem; font-weight: 500;
}
.field textarea { height: auto; padding: 10px 12px; font-size: 1rem; line-height: 1.6; resize: vertical; }
.field input[type="date"] { font-size: 1rem; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  height: 36px; padding: 0 14px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.btn {
  min-height: 48px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg);
  font-size: var(--fs-base); font-weight: 700; cursor: pointer; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none; text-align: center;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.debt { background: var(--khero); color: var(--on-khero); }
.btn.pay { background: var(--ok); color: var(--on-ok); }
.btn.danger { color: var(--owe); }
.btnrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); height: 40px; border-radius: 8px; font-size: 0.9375rem; font-weight: 600; cursor: pointer; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

/* customer rows */
.clist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.crow {
  width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink);
  text-align: left; cursor: pointer; min-height: 64px;
}
.crow:last-child { border-bottom: 0; }
.avatar {
  width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
  background: var(--bg); border: 1px solid var(--line); font-family: var(--font-head); font-weight: 800; font-size: var(--fs-lg);
}
.cmain { min-width: 0; display: grid; }
.cmain b { font-weight: 600; overflow-wrap: anywhere; }
.cmain small { font-size: var(--fs-xs); color: var(--muted); }
.camt { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-lg); text-align: right; }
.camt small { display: block; font-family: var(--font-body); font-weight: 500; font-size: var(--fs-xs); color: var(--muted); }
.tag { display: inline-block; font-size: 0.6875rem; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--owe-bg); color: var(--owe); margin-left: 6px; vertical-align: 1px; }
.tag.sample { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

/* ledger entries */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ledger-h { padding: 12px 14px; font-family: var(--font-display); font-weight: 700; border-bottom: 1px solid var(--line); }
.erow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: start; }
.erow:last-child { border-bottom: 0; }
.ed { min-width: 0; display: grid; }
.ed b { font-weight: 600; font-size: var(--fs-sm); }
.ed span { font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }
.ea { text-align: right; font-family: var(--font-display); font-weight: 800; }
.ea small { display: block; font-family: var(--font-body); font-weight: 500; font-size: var(--fs-xs); color: var(--muted); }
.edel { grid-column: 1 / -1; justify-self: end; border: 0; background: transparent; color: var(--muted); font-size: var(--fs-xs); cursor: pointer; min-height: 32px; padding: 0 4px; text-decoration: underline; }

.fab {
  position: fixed; z-index: 20; height: 52px; padding: 0 20px; border: 0; border-radius: 999px;
  background: var(--khero); color: var(--on-khero); font-size: var(--fs-base); font-weight: 700; cursor: pointer;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); display: inline-flex; align-items: center; gap: 8px;
}
.fab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 6, 7, 0.55); }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0; border: 1px solid var(--line);
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; max-height: 90%; overflow-y: auto;
}
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { color: var(--owe); font-weight: 600; font-size: var(--fs-sm); }
.banner { background: var(--surface); border: 1px dashed var(--muted); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; font-size: var(--fs-sm); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: var(--fs-sm); font-weight: 600; max-width: calc(100% - 32px);
}
.pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  /*CALC-START*/
  var BN = '০১২৩৪৫৬৭৮৯';
  var MONTHS = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
  function toBn(s) { return String(s).replace(/\d/g, function (d) { return BN[+d]; }); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function fmt(n, dec) {
    dec = dec || 0;
    return toBn(Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
  }
  function num(n) { n = round2(n); return fmt(n, Number.isInteger(n) ? 0 : 2); }
  function money(n) { return '৳' + num(n); }
  function parseNum(s) {
    if (s == null) return NaN;
    var t = String(s).replace(/[০-৯]/g, function (d) { return BN.indexOf(d); }).replace(/[,\s৳]/g, '').replace('।', '.');
    if (t === '') return NaN;
    var v = Number(t);
    return isFinite(v) ? v : NaN;
  }
  function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseISO(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function dateTxt(d) {
    var s = toBn(d.getDate()) + ' ' + MONTHS[d.getMonth()];
    return d.getFullYear() === new Date().getFullYear() ? s : s + ' ' + toBn(d.getFullYear());
  }
  function cmpEntry(a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0)); }

  /* Oldest-first settlement: each payment clears the oldest unpaid debt first. */
  function info(entries, todayD) {
    var es = entries.slice().sort(cmpEntry), queue = [], credit = 0, bal = 0, last = null;
    es.forEach(function (e) {
      last = e.date;
      var rem;
      if (e.t === 'debt') {
        bal += e.amt;
        rem = e.amt;
        if (credit > 0) { var use = Math.min(credit, rem); credit -= use; rem -= use; }
        if (rem > 1e-9) queue.push({ date: e.date, amt: rem });
      } else {
        bal -= e.amt;
        rem = e.amt;
        while (rem > 1e-9 && queue.length) {
          var q = queue[0];
          if (q.amt <= rem + 1e-9) { rem -= q.amt; queue.shift(); } else { q.amt -= rem; rem = 0; }
        }
        if (rem > 1e-9) credit += rem;
      }
    });
    bal = round2(bal);
    var oldest = (bal > 0 && queue.length) ? queue[0].date : null;
    var age = oldest ? daysBetween(parseISO(oldest), todayD) : 0;
    return { bal: bal, oldest: oldest, age: age, old: bal > 0 && age >= 30, last: last };
  }
  function normPhone(p) {
    var d = String(p || '').replace(/[০-৯]/g, function (x) { return BN.indexOf(x); }).replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('880') === 0) return d;
    if (d.charAt(0) === '0') return '88' + d;
    if (d.length === 10 && d.charAt(0) === '1') return '880' + d;
    return d;
  }
  function buildMsg(name, shop, tone, inf) {
    var amt = num(inf.bal) + ' টাকা';
    if (tone === 'urgent') {
      return name + ', ' + shop + '-এর খাতায় আপনার ' + amt + ' ' + (inf.age > 0 ? fmt(inf.age) + ' দিন ধরে ' : '') + 'বাকি আছে। আজই যোগাযোগ করে পরিশোধের একটা দিন জানান। ধন্যবাদ।';
    }
    if (tone === 'normal') {
      return name + ', ' + shop + '-এর খাতায় আপনার মোট বাকি ' + amt + '। অনুগ্রহ করে এই সপ্তাহের মধ্যে পরিশোধ করুন। ধন্যবাদ।';
    }
    return 'আসসালামু আলাইকুম ' + name + '। ' + shop + '-এর খাতায় আপনার ' + amt + ' বাকি আছে' +
      (inf.oldest ? ' (' + dateTxt(parseISO(inf.oldest)) + ' থেকে)' : '') + '। সুবিধামতো সময়ে পরিশোধ করলে খুব উপকার হয়। ধন্যবাদ।';
  }
  /*CALC-END*/

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var todayD = new Date(); todayD.setHours(0, 0, 0, 0);
  var todayISO = isoDate(todayD);
  function dateAgo(n) { var d = new Date(todayD); d.setDate(d.getDate() - n); return isoDate(d); }
  function agoTxt(iso) {
    var n = daysBetween(parseISO(iso), todayD);
    return n <= 0 ? 'আজ' : (n === 1 ? 'গতকাল' : fmt(n) + ' দিন আগে');
  }

  /* ---------- storage ---------- */
  var KEY = 'bakir-khata-v1';
  var memOnly = false;
  function readStore() { try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { memOnly = true; return null; } }
  function writeStore() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { memOnly = true; } }
  function sanitize(d) {
    if (!d || !Array.isArray(d.customers)) return null;
    var out = { shop: (typeof d.shop === 'string' && d.shop.trim()) ? d.shop.slice(0, 60) : 'আমার দোকান', sample: !!d.sample, customers: [] };
    d.customers.forEach(function (c) {
      if (!c || typeof c.name !== 'string' || !c.name.trim()) return;
      var cc = { id: String(c.id || uid()), name: c.name.slice(0, 60), phone: typeof c.phone === 'string' ? c.phone.slice(0, 20) : '', sample: !!c.sample, entries: [] };
      (Array.isArray(c.entries) ? c.entries : []).forEach(function (e) {
        if (!e || (e.t !== 'debt' && e.t !== 'pay')) return;
        var a = Number(e.amt);
        if (!isFinite(a) || a <= 0 || !parseISO(e.date)) return;
        cc.entries.push({ id: String(e.id || uid()), t: e.t, amt: a, note: typeof e.note === 'string' ? e.note.slice(0, 80) : '', date: e.date, ts: Number(e.ts) || 0 });
      });
      out.customers.push(cc);
    });
    return out;
  }
  function sampleStore() {
    var n = 0;
    function en(t, amt, ago, note) { n++; return { id: 's' + n, t: t, amt: amt, note: note || '', date: dateAgo(ago), ts: n }; }
    return {
      shop: 'আমার দোকান', sample: true,
      customers: [
        { id: 'c1', name: 'করিম মিয়া', phone: '01700000001', sample: true, entries: [en('debt', 1200, 48, 'চাল, ডাল'), en('pay', 500, 30), en('debt', 350, 6, 'তেল')] },
        { id: 'c2', name: 'সালমা বেগম', phone: '01700000002', sample: true, entries: [en('debt', 640, 12, 'মুদি সদাই'), en('debt', 220, 4)] },
        { id: 'c3', name: 'হাসান স্টোর', phone: '', sample: true, entries: [en('debt', 3500, 35, 'পাইকারি মাল'), en('pay', 1000, 10)] },
        { id: 'c4', name: 'রফিক ভাই', phone: '01700000004', sample: true, entries: [en('debt', 150, 2), en('pay', 150, 1)] }
      ]
    };
  }
  var store = sanitize(readStore()) || sampleStore();
  var state = { view: 'home', cid: null, q: '', filter: 'all', tone: 'soft' };
  writeStore();

  function custById(id) { return store.customers.filter(function (c) { return c.id === id; })[0]; }
  function allInfo() {
    return store.customers.map(function (c) { return { c: c, i: info(c.entries, todayD) }; });
  }

  /* ---------- helpers ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }
  var armed = {};
  function confirmTwice(btn, key, idle, run) {
    if (armed[key]) { clearTimeout(armed[key]); delete armed[key]; run(); return; }
    btn.textContent = 'নিশ্চিত? আবার চাপুন';

    if (t.id === 'q') { state.q = t.value; renderList(); }
    else if (t.id === 'msg') { syncLinks(custById(state.cid)); }
    else if (t.id === 'shopName') { store.shop = t.value.trim() ? t.value.slice(0, 60) : 'আমার দোকান'; writeStore(); }
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'open') go('cust', b.getAttribute('data-id'));
    else if (act === 'back') go('home');
    else if (act === 'settings') go('settings');
    else if (act === 'add-cust') addCustomerSheet();
    else if (act === 'debt') entrySheet('debt');
    else if (act === 'pay') entrySheet('pay');
    else if (act === 'edit-cust') editCustSheet();
    else if (act === 'filter') { state.filter = b.getAttribute('data-f'); renderList(); }
    else if (act === 'tone') { state.tone = b.getAttribute('data-tone'); var c = custById(state.cid); renderRemind(c, info(c.entries, todayD)); }
    else if (act === 'copy-msg') { var ta = $('#msg'); copyText(ta.value, ta); }
    else if (act === 'copy-backup') { var bk = $('#bk'); copyText(bk.value, bk); }
    else if (act === 'del-entry') {
      var id = b.getAttribute('data-id');
      confirmTwice(b, 'de' + id, 'মুছুন', function () {
        var c2 = custById(state.cid);
        c2.entries = c2.entries.filter(function (x) { return x.id !== id; });
        writeStore(); render(); toast('লেনদেন মোছা হয়েছে');
      });
    }
    else if (act === 'clear-sample') {
      confirmTwice(b, 'cs', 'নমুনা মুছে শুরু করুন', function () {
        store.customers = store.customers.filter(function (x) { return !x.sample; });
        store.sample = false; writeStore(); render(); toast('নমুনা মোছা হয়েছে');
      });
    }
    else if (act === 'restore') {
      var raw = $('#rs').value.trim(), err = $('#rsErr'), data = null;
      try { data = sanitize(JSON.parse(raw)); } catch (x) { data = null; }
      if (!data) { err.textContent = 'ব্যাকআপের লেখাটি ঠিক নেই। পুরো লেখা কপি করে পেস্ট করুন।'; err.hidden = false; return; }
      err.hidden = true;
      confirmTwice(b, 'rs', 'ফিরিয়ে আনুন', function () {
        store = data; writeStore(); go('home'); toast('ব্যাকআপ থেকে ফিরে এসেছে');
      });
    }
    else if (act === 'wipe') {
      confirmTwice(b, 'wipe', 'সব তথ্য মুছুন', function () {
        store = { shop: store.shop, sample: false, customers: [] }; writeStore(); go('home'); toast('সব তথ্য মোছা হয়েছে');
      });
    }
  });

  render();
})();
</script>
</body>
</html>
